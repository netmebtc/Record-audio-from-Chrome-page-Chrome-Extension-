<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { 
      width: 250px; 
      padding: 20px; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    h3 { margin-top: 0; color: #333; font-size: 16px; }
    .btn-group { 
      display: flex; 
      gap: 15px; /* 按钮之间的水平间距 */
      margin-top: 20px;
    }
    button { 
      flex: 1; 
      padding: 10px; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold;
      transition: opacity 0.2s;
    }
    #start { background-color: #28a745; color: white; }
    #stop { background-color: #dc3545; color: white; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    #info-panel {
      margin-top: 15px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 4px;
    }
    .label { font-size: 12px; color: #666; }
    .value { font-size: 14px; font-weight: bold; color: #000; }
  </style>
</head>
<body>
  <h3>Spaces Recorder V3</h3>
  
  <div id="info-panel">
    <div>
      <span class="label">Status:</span> 
      <span id="state-text" class="value">Idle</span>
    </div>
    <div style="margin-top: 5px;">
      <span class="label">Duration:</span> 
      <span id="timer" class="value">00:00:00</span>
    </div>
  </div>

  <div class="btn-group">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
